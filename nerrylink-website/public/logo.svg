<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Orbital ring 1 (tilted left) -->
  <ellipse cx="100" cy="95" rx="78" ry="30"
    stroke="#6B21A8" stroke-width="9" fill="none"
    transform="rotate(-35 100 95)" />
  <!-- Orbital ring 2 (tilted right) -->
  <ellipse cx="100" cy="95" rx="78" ry="30"
    stroke="#6B21A8" stroke-width="9" fill="none"
    transform="rotate(35 100 95)" />
  <!-- Orbital ring 3 (vertical) -->
  <ellipse cx="100" cy="95" rx="78" ry="30"
    stroke="#6B21A8" stroke-width="9" fill="none"
    transform="rotate(90 100 95)" />

  <!-- Node dots on orbital ends -->
  <!-- Red node top-left -->
  <circle cx="30" cy="68" r="10" fill="#DC2626" />
  <!-- Purple node top-right -->
  <circle cx="168" cy="68" r="8" fill="#6B21A8" />
  <!-- Purple node bottom -->
  <circle cx="100" cy="168" r="8" fill="#6B21A8" />

  <!-- Center gear (outer teeth) -->
  <circle cx="100" cy="95" r="22" fill="none" stroke="#DC2626" stroke-width="3"
    stroke-dasharray="6 3" />
  <!-- Center filled circle -->
  <circle cx="100" cy="95" r="14" fill="#DC2626" />

  <!-- Text: NERRYLINK -->
  <text x="100" y="196"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="18"
    fill="#DC2626"
    text-anchor="middle"
    letter-spacing="1">NERRYLINK</text>
  <!-- Text: COMPUTER AND GADGETS -->
  <text x="100" y="214"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="10"
    fill="#DC2626"
    text-anchor="middle"
    letter-spacing="0.5">COMPUTER AND GADGETS</text>
</svg>
