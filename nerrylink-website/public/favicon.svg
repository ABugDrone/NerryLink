<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White background circle for favicon clarity -->
  <circle cx="50" cy="50" r="50" fill="white"/>
  <!-- Orbital ring 1 -->
  <ellipse cx="50" cy="50" rx="40" ry="16"
    stroke="#6B21A8" stroke-width="5" fill="none"
    transform="rotate(-35 50 50)" />
  <!-- Orbital ring 2 -->
  <ellipse cx="50" cy="50" rx="40" ry="16"
    stroke="#6B21A8" stroke-width="5" fill="none"
    transform="rotate(35 50 50)" />
  <!-- Orbital ring 3 -->
  <ellipse cx="50" cy="50" rx="40" ry="16"
    stroke="#6B21A8" stroke-width="5" fill="none"
    transform="rotate(90 50 50)" />
  <!-- Red node -->
  <circle cx="16" cy="36" r="6" fill="#DC2626" />
  <!-- Purple nodes -->
  <circle cx="83" cy="36" r="5" fill="#6B21A8" />
  <circle cx="50" cy="86" r="5" fill="#6B21A8" />
  <!-- Center gear ring -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="7" fill="#DC2626" />
</svg>
